<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>CISPR 15 — Iniciando (dev)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0B0E14;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: Arial, sans-serif;
  user-select: none;
  -webkit-app-region: drag;
  overflow: hidden;
}
.wrap { text-align: center; }
.stage {
  position: relative;
  width: 140px; height: 100px;
  margin: 0 auto 16px;
}
.bat {
  position: absolute;
  left: 50%; bottom: 18px;
  font-size: 46px;
  transform-origin: bottom center;
  animation: paulada 0.6s ease-in-out infinite;
}
.target {
  position: absolute;
  left: 50%; bottom: 14px;
  transform: translateX(-50%);
  font-size: 34px;
}
.impact {
  position: absolute;
  left: 50%; bottom: 30px;
  transform: translateX(-50%) scale(0);
  font-size: 22px;
  animation: impacto 0.6s ease-in-out infinite;
}
@keyframes paulada {
  0%   { transform: translateX(-90%) rotate(-55deg); }
  45%  { transform: translateX(-50%) rotate(15deg); }
  55%  { transform: translateX(-50%) rotate(15deg); }
  100% { transform: translateX(-90%) rotate(-55deg); }
}
@keyframes impacto {
  0%, 40%  { opacity: 0; transform: translateX(-50%) scale(0); }
  50%      { opacity: 1; transform: translateX(-50%) scale(1.3); }
  65%, 100%{ opacity: 0; transform: translateX(-50%) scale(0.6); }
}
.title {
  color: #E8B94B;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
}
.subtitle {
  color: rgba(255,255,255,0.3);
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 6px;
}
.status {
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 18px;
}
.dev-tag {
  position: absolute;
  top: 14px; right: 16px;
  color: rgba(232,185,75,0.4);
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 700;
  border: 1px solid rgba(232,185,75,0.25);
  border-radius: 4px;
  padding: 2px 6px;
}
</style>
</head>
<body>
<div class="dev-tag">DEV</div>
<div class="wrap">
  <div class="stage">
    <span class="target">🪵</span>
    <span class="impact">💥</span>
    <span class="bat">🏏</span>
  </div>
  <div class="title">CISPR 15</div>
  <div class="subtitle">LABELO / PUCRS</div>
  <div class="status" id="status">tung tung tung sahur...</div>
</div>
<script>
  const frases = [
    'tung tung tung sahur...',
    'tung tung tung sahur!!',
    'iniciando servidor...',
  ]
  let i = 0
  setInterval(() => {
    i = (i + 1) % frases.length
    document.getElementById('status').textContent = frases[i]
  }, 900)
</script>
</body>
</html>
